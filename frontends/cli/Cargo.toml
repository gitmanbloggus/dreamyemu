[package]
name = "dreamyemu-cli"
version = "0.4.2"
edition = "2024"
license = "GPL-2.0-or-later"
description = "The Dreamyemu command line: run, measure and inspect a boot image without a UI"
authors = ["Dreamyemu"]
repository = "https://github.com/gitmanbloggus/dreamyemu"
publish = false

# **O nome do binário continua `dreamyemu`.** Ele era a janela do egui e a linha de comando juntas; a
# janela saiu (a interface é o `dreamyemu-qt`, em `frontends/qt-standalone`), e a linha de comando
# ficou com o nome, que é o que os scripts, o CI e a documentação digitam: `dreamyemu sessao`,
# `dreamyemu bench`, `dreamyemu run`.
#
# **Sem Qt de propósito.** Estas são as ferramentas de medir e de depurar, e elas precisam compilar
# numa máquina ou num contêiner sem o Qt instalado. Também não sai em instalador nenhum.
[[bin]]
name = "dreamyemu"
path = "src/main.rs"

[dependencies]
# Os dispositivos do host (gilrs, Wii Remote), a janela crua do `run --window` (minifb) e o contexto
# fora de tela do `sessao --placa` e do `bench` (glutin) vêm pela feature `desktop` do núcleo, que é
# a padrão.
dreamyemu = { path = "../.." }

[build-dependencies]
winresource = "0.1"
