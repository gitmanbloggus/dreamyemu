# Compila o núcleo para iOS e monta o .app, sem esperar a tag.
#
# O `release.yml` monta o mesmo aplicativo, mas só no dia da tag. Aqui ele sai sozinho, à mão.
# Nenhum push dispara isto.

name: ios

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-ci

      - name: Simulador
        run: frontends/ios/compilar.sh --app

      - name: Aparelho
        run: frontends/ios/compilar.sh --app-aparelho

      - name: Abre no simulador
        run: |
          set -euo pipefail
          dispositivo="$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*iPhone[^(]*(\([A-F0-9-]\{36\}\)).*/\1/p' | head -1)"
          test -n "$dispositivo"
          xcrun simctl boot "$dispositivo" || true
          xcrun simctl bootstatus "$dispositivo" -b
          xcrun simctl install "$dispositivo" frontends/ios/build/iphonesimulator/Dreamyemu.app
          xcrun simctl launch "$dispositivo" io.github.dreamyemuteam.dreamyemu

      - name: Empacota
        run: frontends/ios/compilar.sh --pacote

      - uses: actions/upload-artifact@v4
        with:
          name: dreamyemu-ios-simulator
          path: frontends/ios/build/dreamyemu-ios-simulator.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dreamyemu-ios
          path: frontends/ios/build/dreamyemu-ios.zip
          if-no-files-found: error
